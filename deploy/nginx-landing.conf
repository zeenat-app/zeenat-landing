# Bootstrap HTTP config. Certbot adds TLS and the HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name www.zeenat.app;
    return 301 https://zeenat.app$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name zeenat.app;
    root /var/www/zeenat-landing/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    gzip on;
    gzip_types text/css application/xml image/svg+xml;
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
